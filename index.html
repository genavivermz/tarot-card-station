<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fortune teller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Gabriela&family=Princess+Sofia&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="sparkle-field" aria-hidden="true">
      <span class="sp s1">˖᯽ ݁˖</span>
      <span class="sp s2">₊ ⊹</span>
      <span class="sp s3">ꕤ｡˚⋆</span>
      <span class="sp s4">⋆˚꩜｡</span>
      <span class="sp s5">𖤝</span>
      <span class="sp s6">˖᯽ ݁˖</span>
      <span class="sp s7">₊ ⊹</span>
      <span class="sp s8">ꕤ｡˚⋆</span>
      <span class="sp s9">⋆˚꩜｡</span>
      <span class="sp s10">𖤝</span>
    </div>

    <div class="shell">
      <div class="page">
        <div class="page-corners" aria-hidden="true">
          <span>˖᯽ ݁˖</span><span>ꕤ｡˚⋆</span><span>⋆˚꩜｡</span><span>𖤝</span>
        </div>

        <header class="topbar">
          <h1>fortune teller</h1>
          <div class="actions">
            <button type="button" id="reshuffle-btn" class="btn ghost">
              reshuffle remaining
            </button>
            <button type="button" id="new-reading-btn" class="btn solid">
              new reading
            </button>
          </div>
        </header>

        <main class="station is-fresh">
          <section class="table-wrap" aria-label="reading table">
            <div class="table">
              <div class="spread empty" id="spread"></div>
            </div>
          </section>
          <aside class="deck-column">
            <button type="button" id="deck-btn" class="deck" aria-label="draw a card">
              <span class="deck-stack" aria-hidden="true">
                <img class="deck-layer l1" src="cards/back.png" alt="" />
                <img class="deck-layer l2" src="cards/back.png" alt="" />
                <img class="deck-layer l3" src="cards/back.png" alt="" />
                <img class="deck-face" src="cards/back.png" alt="" />
              </span>
            </button>
          </aside>
        </main>
      </div>

      <aside class="meaning-rail" aria-label="card meaning">
        <p class="meaning-placeholder" aria-hidden="true">𖤝</p>
        <div class="overlay" id="overlay" hidden>
          <article class="meaning-panel" id="meaning-panel" aria-labelledby="meaning-title">
            <button type="button" class="close-btn" id="close-meaning" aria-label="close meaning">
              close ₊ ⊹
            </button>
            <div class="meaning-art">
              <img id="meaning-image" alt="" />
            </div>
            <div class="meaning-copy">
              <p class="meaning-kicker" id="meaning-kicker"></p>
              <h2 id="meaning-title"></h2>
              <p class="orientation-badge" id="orientation-badge"></p>
              <p class="keywords" id="meaning-keywords"></p>
              <p class="meaning-body" id="meaning-body"></p>
              <h3>in love</h3>
              <p class="meaning-extra" id="meaning-love"></p>
              <h3>in work and the path</h3>
              <p class="meaning-extra" id="meaning-path"></p>
              <h3>advice</h3>
              <p class="meaning-advice" id="meaning-advice"></p>
            </div>
          </article>
        </div>
      </aside>
    </div>

    <script src="js/cards.js"></script>
    <script src="js/details.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
